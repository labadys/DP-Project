databaseChangeLog:
  - changeSet:
      id: 1
      author: your_name
      changes:
        - createTable:
            tableName: publishers
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: varchar(500)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: your_name
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: isbn
                  type: varchar(20)
              - column:
                  name: publication_year
                  type: integer
              - column:
                  name: author_id
                  type: bigint
              - column:
                  name: publisher_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_book_publisher
                    references: publishers(id)

  - changeSet:
      id: 3
      author: your_name
      changes:
        - createTable:
            tableName: book_genre
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_genre_book
                    references: books(id)
              - column:
                  name: genre_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_book_genre_genre
                    references: genres(id)
            constraints:
              primaryKey:
                columnNames: book_id, genre_id

  # Упрощенная миграция для пользователей (без ролей)
  - changeSet:
      id: 4
      author: your_name
      changes:
        - createTable:
            tableName: app_users
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(100)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValue: true

  - changeSet:
      id: 5
      author: your_name
      changes:
        - insert:
            tableName: app_users
            columns:
              - column:
                  name: username
                  value: admin
              - column:
                  name: password
                  value: $2a$10$XURPShQNCsLjp1ESc2laoObo9QZDhxz73hJPaEv7/cBha4pk0AgP.  # password: "password"
              - column:
                  name: email
                  value: admin@library.com
              - column:
                  name: enabled
                  value: true